name: Deploy Capture My Heart to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _extract
          mkdir -p _site _extract
          unzip -q capture_my_heart_v0_5_1.zip -d _extract
          cp -a _extract/capture_my_heart_v0_5_1/. _site/

          # GitHub Pages public-beta overrides.
          cp overrides/config.js _site/config.js
          cp overrides/feedback.js _site/feedback.js
          cp overrides/analytics.js _site/analytics.js
          cp overrides/privacy.html _site/privacy.html
          cp overrides/sw.js _site/sw.js

          # 90%+ bonus scene assets.
          BONUS_SCENE_READY=0
          STAGE2_BONUS_READY=0
          if [ -f overrides/assets/stage1_maid_bonus.webm ]; then
            mkdir -p _site/assets/bonus
            cp overrides/assets/stage1_maid_bonus.webm _site/assets/bonus/stage1_maid_bonus.webm
            BONUS_SCENE_READY=1
          fi
          if [ -f overrides/assets/stage2_racinggirl_bonus.webm ]; then
            mkdir -p _site/assets/bonus
            cp overrides/assets/stage2_racinggirl_bonus.webm _site/assets/bonus/stage2_racinggirl_bonus.webm
            STAGE2_BONUS_READY=1
          elif [ -f 'overrides/assets/Stage2_RacingGirl_Bonus_REACH_HOLD_1p5s(2).webm' ]; then
            mkdir -p _site/assets/bonus
            cp 'overrides/assets/Stage2_RacingGirl_Bonus_REACH_HOLD_1p5s(2).webm' _site/assets/bonus/stage2_racinggirl_bonus.webm
            STAGE2_BONUS_READY=1
          fi

          # Private owner dashboard UI (data remains behind the Edge Function key).
          mkdir -p _site/admin
          cp -a overrides/admin/. _site/admin/

          # Apply gameplay and analytics patches to the stable beta bundle.
          python overrides/playfeel_patch.py _site
          python overrides/mobile_controls_patch.py _site
          python overrides/analytics_patch.py _site
          if [ "$BONUS_SCENE_READY" = "1" ]; then
            python overrides/bonus_scene_patch.py _site
            # Force existing clients onto the current bonus-scene build.
            sed -i 's/cmh-core-v0.5.4.2/cmh-core-v0.5.8/' _site/sw.js
          fi

          # Cloudflare-only files are not part of the static GitHub Pages build.
          rm -rf _site/functions
          rm -f _site/wrangler.toml.example

          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/game.js
          test -f _site/analytics.js
          test -f _site/admin/index.html
          test -f _site/admin/admin.js
          test -f _site/assets/images/title.webp
          grep -q "cmh_feedback" _site/config.js
          grep -q "cmh_analytics_events" _site/config.js
          grep -q "CMH_ANALYTICS" _site/game.js
          grep -q "analytics.js" _site/index.html
          grep -q "cmh_admin_dashboard" _site/admin/admin.js
          if [ "$BONUS_SCENE_READY" = "1" ]; then
            test -f _site/assets/bonus/stage1_maid_bonus.webm
            grep -q "bonus_scene_view" _site/game.js
            grep -q "stage1_maid_bonus.webm" _site/game.js
            grep -q "stage2_racinggirl_bonus.webm" _site/game.js
            grep -q "bonusToggleBtn" _site/game.js
          fi
          if [ "$STAGE2_BONUS_READY" = "1" ]; then
            test -f _site/assets/bonus/stage2_racinggirl_bonus.webm
          fi
          grep -q "autoRetract" _site/game.js
          grep -q "dashTouchBtn" _site/index.html
          grep -q "moveJoystick" _site/index.html
          grep -q "bindHoldButton" _site/game.js
          grep -q "setPointerCapture" _site/game.js
          grep -q "avoid-left" _site/styles.css
          node --check _site/game.js
          node --check _site/analytics.js
          node --check _site/feedback.js
          node --check _site/admin/admin.js
          echo "Prepared $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
