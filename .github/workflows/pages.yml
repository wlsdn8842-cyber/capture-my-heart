name: Deploy Capture My Heart to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _extract
          mkdir -p _site _extract
          unzip -q capture_my_heart_v0_5_1.zip -d _extract
          cp -a _extract/capture_my_heart_v0_5_1/. _site/

          # GitHub Pages public-beta overrides.
          cp overrides/config.js _site/config.js
          cp overrides/feedback.js _site/feedback.js
          cp overrides/sw.js _site/sw.js

          # Apply v0.5.3 gameplay-feedback hotfixes.
          python overrides/playfeel_patch.py _site

          # Cloudflare-only files are not part of the static GitHub Pages build.
          rm -rf _site/functions
          rm -f _site/wrangler.toml.example

          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/game.js
          test -f _site/assets/images/title.webp
          grep -q "cmh_feedback" _site/config.js
          grep -q "autoRetract" _site/game.js
          grep -q "dashTouchBtn" _site/index.html
          grep -q "avoid-left" _site/styles.css
          node --check _site/game.js
          echo "Prepared $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
