name: Deploy Capture My Heart to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _extract
          mkdir -p _site _extract
          unzip -q capture_my_heart_v0_5_1.zip -d _extract
          cp -a _extract/capture_my_heart_v0_5_1/. _site/

          # GitHub Pages public-beta overrides.
          cp overrides/config.js _site/config.js
          cp overrides/feedback.js _site/feedback.js
          cp overrides/collection.js _site/collection.js
          cp overrides/collection.html _site/collection.html
          cp overrides/analytics.js _site/analytics.js
          cp overrides/character_masks.js _site/character_masks.js
          cp overrides/privacy.html _site/privacy.html
          cp overrides/sw.js _site/sw.js

          # 90%+ bonus scene assets. Stage 1-10 ship as one atomic archive.
          test -f overrides/assets/service_scenes_stage1-10.zip
          mkdir -p _site/assets/bonus
          unzip -q -o overrides/assets/service_scenes_stage1-10.zip -d _site/assets/bonus
          for n in $(seq -w 1 10); do
            test -f "_site/assets/bonus/stage${n}_service.webm"
          done

          # Private owner dashboard UI (data remains behind the Edge Function key).
          mkdir -p _site/admin
          cp -a overrides/admin/. _site/admin/

          # Apply gameplay and analytics patches to the stable beta bundle.
          python overrides/playfeel_patch.py _site
          python overrides/mobile_controls_patch.py _site
          python overrides/analytics_patch.py _site
          python overrides/mobile_layout_patch.py _site
          python overrides/adsense_verify_patch.py _site
          python overrides/bonus_scene_patch.py _site
          python overrides/visual_refresh_patch.py _site
          python overrides/age_gate_patch.py _site
          python overrides/interactive_tutorial_patch.py _site
          python overrides/mobile_ux_v2_patch.py _site
          python overrides/mobile_landscape_hud_patch.py _site
          python overrides/mobile_viewport_enlarge_patch.py _site
          python overrides/feedback_round1_patch.py _site
          python overrides/balance_round1_patch.py _site
          python overrides/juice_v1_patch.py _site
          python overrides/boss_breakout_patch.py _site
          python overrides/character_mask_shadow_patch.py _site
          python overrides/character_mask_stage1_gate_patch.py _site
          python overrides/stage1_emergency_escape_patch.py _site
          python overrides/containment_pressure_patch.py _site
          python overrides/collection_reward_patch.py _site
          python overrides/stage1_rage_v2_patch.py _site
          python overrides/service_scene_v2_patch.py _site

          # Build the all-clear collection archive from the deployed stage art.
          zip -q -j _site/assets/cmh-complete-collection.zip \
            _site/assets/images/stage01.webp _site/assets/images/stage02.webp \
            _site/assets/images/stage03.webp _site/assets/images/stage04.webp \
            _site/assets/images/stage05.webp _site/assets/images/stage06.webp \
            _site/assets/images/stage07.webp _site/assets/images/stage08.webp \
            _site/assets/images/stage09.webp _site/assets/images/stage10.webp

          # Cloudflare-only files are not part of the static GitHub Pages build.
          rm -rf _site/functions
          rm -f _site/wrangler.toml.example

          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/game.js
          test -f _site/analytics.js
          test -f _site/collection.js
          test -f _site/collection.html
          test -f _site/assets/cmh-complete-collection.zip
          test -f _site/admin/index.html
          test -f _site/admin/admin.js
          test -f _site/assets/images/title.webp
          grep -q "cmh_feedback" _site/config.js
          grep -q "cmh_analytics_events" _site/config.js
          grep -q "CMH_ANALYTICS" _site/game.js
          grep -q "analytics.js" _site/index.html
          grep -q "cmh_admin_dashboard" _site/admin/admin.js
          for n in $(seq -w 1 10); do
            test -f "_site/assets/bonus/stage${n}_service.webm"
            grep -q "stage${n}_service.webm" _site/game.js
          done
          grep -q "bonus_scene_view" _site/game.js
          grep -q "bonusToggleBtn" _site/game.js
          grep -q "autoRetract" _site/game.js
          grep -q "dashTouchBtn" _site/index.html
          grep -q "moveJoystick" _site/index.html
          grep -q "bindHoldButton" _site/game.js
          grep -q "setPointerCapture" _site/game.js
          grep -q "avoid-left" _site/styles.css
          grep -q "v0.6.0 mobile-landscape hotfix" _site/styles.css
          grep -q "v0.12.3 service scenes 1-10" _site/index.html
          grep -q "ca-pub-6414931308880829" _site/index.html
          grep -q "ca-pub-6414931308880829" _site/config.js
          grep -q "drawPlayerVisual" _site/game.js
          grep -q "drawEnemyVisual" _site/game.js
          grep -q "v0.6.5 focus pause hotfix" _site/game.js
          grep -q "cmh-core-v0.12.3" _site/sw.js
          grep -q "function platform()" _site/analytics.js
          grep -q "function trafficSource()" _site/analytics.js
          grep -q "traffic_source:trafficSource()" _site/analytics.js
          grep -q "실제 유입경로" _site/admin/index.html
          grep -q "id=\"platforms\"" _site/admin/index.html
          grep -q "AGE_PERSIST_KEY" _site/game.js
          grep -q "ageExitBtn" _site/index.html
          grep -q "19세 이상입니다" _site/index.html
          grep -q "TUTORIAL_V2_KEY" _site/game.js
          grep -q "cmh.tutorial.interactive.v1.status" _site/game.js
          grep -q "initTutorialGrid" _site/game.js
          grep -q "!state.paused&&!tutorial.active" _site/game.js
          grep -q "tutorial_step_complete" _site/game.js
          grep -q "tutorial_start" _site/game.js
          grep -q "tutorial_skip" _site/game.js
          grep -q "tutorial_replay" _site/game.js
          grep -q "PLAY TUTORIAL AGAIN" _site/game.js
          grep -q "interactive-v2" _site/styles.css
          grep -q "mobileCaptureLocked" _site/game.js
          grep -q "mobile_capture_lock_on" _site/game.js
          grep -q "CAPTURE ON" _site/game.js
          grep -q "TAP CAPTURE" _site/game.js
          grep -q "MOBILE ONLY UX v2" _site/styles.css
          grep -q "mobile-landscape HUD rail" _site/styles.css
          grep -q "mobile viewport enlarge tuning" _site/styles.css
          grep -q "aspect-ratio:1.22/1" _site/styles.css
          grep -q "aspect-ratio:1.46/1" _site/styles.css
          grep -q "feedback round1 UX" _site/styles.css
          grep -q "ending_auto_title" _site/game.js
          grep -q "gallery_art_open" _site/game.js
          grep -q "BALANCE_V1" _site/game.js
          grep -q "balanceV1Profile" _site/game.js
          grep -q "shotClock" _site/game.js
          grep -q "SETTINGS에서 BGM/SFX" _site/game.js
          grep -q "JUICE_V1" _site/game.js
          grep -q "juiceItemPickup" _site/game.js
          grep -q "juiceCaptureFX" _site/game.js
          grep -q "juiceMissFX" _site/game.js
          grep -q "item_pickup" _site/game.js
          grep -q "prefers-reduced-motion" _site/game.js
          grep -q "BOSS_BREAKOUT_V1" _site/game.js
          grep -q "bossUpdatePattern" _site/game.js
          grep -q "bossReopenCells" _site/game.js
          grep -q "drawBossPatternVisual" _site/game.js
          grep -q "boss_pattern_start" _site/game.js
          grep -q "boss_territory_break" _site/game.js
          test -f _site/character_masks.js
          grep -q "CMH_CHARACTER_MASKS" _site/character_masks.js
          grep -q "Character Mask Shadow Mode" _site/game.js
          grep -q "character_mask_shadow" _site/game.js
          grep -q "stageProgressMetric" _site/game.js
          grep -q "perfectTarget" _site/game.js
          grep -q "metric_value" _site/game.js
          grep -q "stage1EmergencyEscape" _site/game.js
          grep -q "stage1_escape" _site/game.js
          grep -q "PANIC! · BREAKOUT!" _site/game.js
          grep -q "CONTAINMENT_V1" _site/game.js
          grep -q "bossOpenComponent" _site/game.js
          grep -q "boss_containment_start" _site/game.js
          grep -q "containmentPendingMilestone" _site/game.js
          grep -q "pressureBoost" _site/game.js
          grep -q "STAGE1_RAGE_V2" _site/game.js
          grep -q "stage1RageReclaimCells" _site/game.js
          grep -q "stage1_rage_start" _site/game.js
          grep -q "stage1_rage_retrap" _site/game.js
          grep -q "RAGE! · CHAR -" _site/game.js
          grep -q "containment pressure" _site/styles.css
          test -f _site/admin/mask-editor.html
          grep -q "label:'STOP'" _site/game.js
          grep -q "label:'SLOW'" _site/game.js
          grep -q "VERSION: '0.12.3'" _site/config.js
          grep -q "COLLECTION:" _site/config.js
          grep -q "cmh-collection-request" _site/config.js
          grep -q "endingCollection" _site/game.js
          grep -q "collection.js" _site/index.html
          grep -q "v0.12.3 service scenes 1-10" _site/index.html
          node --check _site/game.js
          node --check _site/analytics.js
          node --check _site/feedback.js
          node --check _site/collection.js
          node --check _site/admin/admin.js
          echo "Prepared $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Prepare itch.io HTML5 build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _itch
          mkdir -p _itch
          cp _site/index.html _site/styles.css _site/config.js _site/ads.js _site/analytics.js _site/feedback.js _site/collection.js _site/collection.html _site/character_masks.js _site/game.js _site/manifest.webmanifest _site/privacy.html _site/sw.js _itch/
          cp -a _site/assets _itch/assets
          test -f _itch/index.html
          test -f _itch/game.js
          for n in $(seq -w 1 10); do
            test -f "_itch/assets/bonus/stage${n}_service.webm"
          done
          if [ -d _itch/admin ]; then
            echo "admin directory must not be included in itch build" >&2
            exit 1
          fi
          echo "Prepared itch.io HTML5 build: $(find _itch -type f | wc -l) files"

      - name: Install itch.io butler
        if: ${{ env.BUTLER_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o /tmp/butler.zip
          rm -rf /tmp/butler
          mkdir -p /tmp/butler
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler version

      - name: Push HTML5 build to itch.io
        if: ${{ env.BUTLER_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*VERSION: '\([^']*\)'.*/\1/p" _site/config.js | head -n1)"
          test -n "$VERSION"
          /tmp/butler/butler push _itch wlsdn8842-cyber/capture-my-heart:html5 --userversion "$VERSION" --if-changed

      - name: itch.io auto-deploy not enabled yet
        if: ${{ env.BUTLER_API_KEY == '' }}
        shell: bash
        run: |
          echo "::notice::GitHub Pages deployed successfully. itch.io upload was skipped because repository secret BUTLER_API_KEY is not configured yet."
